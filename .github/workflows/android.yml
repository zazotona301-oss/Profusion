name: Build Android APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        run: pnpm android:sync

      - name: Build debug APK and release artifacts
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profusion-clinic-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/profusion-clinic-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-files/profusion-clinic-release-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-files/profusion-clinic-release.aab

      - name: Publish APK and AAB to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build-${{ github.run_id }}" \
            release-files/profusion-clinic-debug.apk \
            release-files/profusion-clinic-release-unsigned.apk \
            release-files/profusion-clinic-release.aab \
            --repo "${{ github.repository }}" \
            --title "عيادتي Android build #${{ github.run_number }}" \
            --notes "نسخة Android تلقائية من commit ${{ github.sha }}. ملف AAB غير موقّع ومناسب للاختبار؛ يلزم توقيع Release قبل النشر على Google Play." \
            --latest
