name: Build Android APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        run: pnpm android:sync

      - name: Build debug APK and release artifacts
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profusion-clinic-android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
